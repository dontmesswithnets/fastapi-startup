<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #57534e;
        --paper: #f5f0e8;
        --card: #fffcf7;
        --line: #e7e0d4;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }

      main {
        width: min(36rem, 100%);
      }

      .stack {
        margin: 0 0 0.75rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.85rem;
        font-weight: 600;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      nav {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      a {
        display: block;
        padding: 0.9rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        border-color: var(--accent);
      }

      a span {
        display: block;
        margin-top: 0.2rem;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="stack">FastAPI · Pydantic v2 · SQLAlchemy 2</p>
      <h1>{{ title }}</h1>
      <p class="lead">
        A small synchronous API. JSON lives on the health routes; interactive
        docs are in Swagger.
      </p>
      <nav>
        <a href="/docs">Swagger UI<span>Try the JSON API</span></a>
        <a href="/health">Process health<span>GET /health — no database</span></a>
        <a href="/health/db">Database health<span>GET /health/db — SELECT 1</span></a>
      </nav>
    </main>
  </body>
</html>
