name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing GHCR tag to deploy"
        required: true
        type: string
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+psycopg://admin:password@localhost:5432/fake
      TEST_DATABASE_URL: postgresql+psycopg://admin:password@localhost:5432/startup_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: startup_test
        ports:
          ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: clone repo to runner
        uses: actions/checkout@v5
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: install dependencies
        run: make sync
      - name: run checks
        run: make check
      - name: docker build
        run: docker build .
  build-push:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dontmesswithnets/fastapi-startup
          tags: |
            type=sha,format=short,priority=1000
            type=raw,value=latest,enable={{is_default_branch}},priority=100
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    needs: [ check, build-push ]
    if: |
      !cancelled() && (
        (github.event_name == 'push' && needs.check.result == 'success' && needs.build-push.result == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: prepare ssh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: copy compose file
        run: |
          scp -P 717 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            docker-compose.yml \
            deploy@149.154.69.38:/opt/fastapi-startup/docker-compose.yml
      - name: pull and start
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || needs.build-push.outputs.tag }}
        run: |
          ssh -p 717 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            deploy@149.154.69.38 \
            "cd /opt/fastapi-startup && \
             export APP_IMAGE=ghcr.io/dontmesswithnets/fastapi-startup:${IMAGE_TAG} && \
             docker compose pull && \
             docker compose up -d --no-build && \
             curl -fsS --retry 9 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health/db" && \
             docker image prune -af


