name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+psycopg://admin:password@localhost:5432/fake
      TEST_DATABASE_URL: postgresql+psycopg://admin:password@localhost:5432/startup_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: startup_test
        ports:
          ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: clone repo to runner
        uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: install dependencies
        run: make sync
      - name: run checks
        run: make check
